name: 'Notify Compass'
description: 'Send deployment/build events to Atlassian Compass via Ops Gateway'
author: 'Alikuxac'
inputs:
  type:
    description: 'Event type (deployment, build, incident, alert). Auto-detected if omitted.'
    required: false
  status:
    description: 'Status of the event (SUCCESSFUL, FAILED, etc.)'
    required: true
  gateway-url:
    description: 'URL of the Ops Gateway. Defaults to process.env.OPS_GATEWAY_URL if omitted.'
    required: false

  gateway-secret:
    description: 'X-GATEWAY-SECRET for auth'
    required: true
  path:
    description: 'Sub-path for monorepo mapping'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'


